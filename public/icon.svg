<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle Grid Pattern Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Clipboard / Badge Base -->
  <g filter="url(#shadow)">
    <rect x="116" y="110" width="280" height="320" rx="36" fill="#ffffff" />
    
    <!-- Clip Top Header -->
    <rect x="186" y="86" width="140" height="48" rx="16" fill="#2563eb" />
    <circle cx="256" cy="110" r="10" fill="#ffffff" />
    
    <!-- Header stripe in board -->
    <rect x="150" y="166" width="120" height="14" rx="7" fill="#94a3b8" />
    <rect x="150" y="196" width="212" height="8" rx="4" fill="#cbd5e1" />
    
    <!-- Row 1: Checked Attendance -->
    <circle cx="168" cy="242" r="14" fill="#dcfce7" />
    <path d="M162 242l4 4 8-8" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="196" y="238" width="150" height="10" rx="5" fill="#64748b" />
    
    <!-- Row 2: Checked Attendance -->
    <circle cx="168" cy="286" r="14" fill="#dcfce7" />
    <path d="M162 286l4 4 8-8" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="196" y="282" width="120" height="10" rx="5" fill="#64748b" />
    
    <!-- Row 3: Duty Time Badge -->
    <circle cx="168" cy="330" r="14" fill="#dbeafe" />
    <circle cx="168" cy="330" r="8" fill="none" stroke="#2563eb" stroke-width="2.5" />
    <path d="M168 325v5l3 3" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <rect x="196" y="326" width="135" height="10" rx="5" fill="#64748b" />
  </g>
  
  <!-- Success Badge Overlay (Punch In Verified) -->
  <g filter="url(#shadow)">
    <circle cx="366" cy="376" r="62" fill="url(#accent)" stroke="#ffffff" stroke-width="8" />
    <!-- Checkmark -->
    <path d="M346 376l14 14 26-26" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
